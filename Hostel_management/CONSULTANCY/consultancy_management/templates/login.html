{% extends "base.html" %}

{% block title %}Login - Hostel Management System{% endblock %}

{% block content %}
<div class="container">
    <div style="max-width: 400px; margin: 4rem auto;">
        <div class="card animate-scaleIn">
            <h2 class="card-header" style="text-align: center;">Login</h2>
            <form method="POST" action="{{ url_for('auth.login') }}">
                <div class="form-group animate-fadeIn">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="form-group animate-fadeIn" style="animation-delay: 0.1s;">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
